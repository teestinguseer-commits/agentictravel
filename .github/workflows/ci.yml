name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Postgres with pgvector, so the embeddings migration is tested too.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Graph definitions, tool contracts and golden set
        run: npm run check
      - name: Type check
        run: npm run typecheck
      - name: Server tests (MCP over in-memory, stdio and HTTP)
        run: npm test
      - name: Golden set against the MCP server (pinned clock)
        env:
          LIFELIST_NOW: "2026-10-18T06:00:00Z"
        run: npm run golden:run
      - name: Freshness at today's date (warning only)
        run: npm run golden:run || echo "::warning::Some golden checks fail at today's date, usually because seeded facts have passed their freshness limit. Re-verify them."
      - name: Seed SQL is up to date with the YAML definitions
        run: |
          npm run --silent graph:seed-sql
          git diff --exit-code supabase/seed.sql
      - name: Migrations, seed and smoke checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run db:test
