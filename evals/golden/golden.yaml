# Lifelist golden set: 100 travel questions with known answers.
# See docs/evals.md. Every item names the tool a good agent should call, deterministic
# checks on that tool's (normalized) output, and a reference answer. Judge-graded items
# carry a rubric instead of, or as well as, checks. `review: pending` means a person has
# not yet confirmed the truth against a primary source.
version: 1
created: "2026-10-17"
