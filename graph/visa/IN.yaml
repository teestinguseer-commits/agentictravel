# Visa rules for Indian passports (ordinary passports, tourism), one entry per country
# or group that a Lifelist experience enters. Maintained by the World-change Scout
# (agents/world-change-scout), reviewed through pull requests, read by the MCP server.
#
# effort:          none = no visa; low = e-visa, eTA or on arrival; medium = online application
#                  with documents or through an agent; high = consular visa with an appointment
# lead_time_days:  how many days before departure to start, including appointment waits and
#                  processing. These are planning estimates, not official figures.
# confidence:      every entry starts low. A person (or the Verifier, later) raises it after
#                  checking the official source.
passport: IN
updated: "2026-11-01"
rules:
  - country: SCHENGEN
    name: Schengen area
    covers: [ES, FR, DE, BE, NO, SE, FI, IS, MC]
    effort: high
    visa_type: Schengen short-stay (C) visa, applied through the destination country's visa centre
    lead_time_days: 60
    note: Apply at the consulate of the main destination; appointments can be booked up to 6 months ahead. Monaco is not in Schengen but is entered through France on a Schengen visa.
    refusal_rate: 0.158
    official_sources:
      - https://home-affairs.ec.europa.eu/policies/schengen-borders-and-visa/visa-policy_en
    open_questions:
      - Lead time varies by consulate and season; replace the estimate with current appointment waits per visa centre.
    checked_at: "2026-10-18"
    verified_by: claude-desk-research
    confidence: low

